name: Учебные проверки
on:
  push:
    paths-ignore: ['docs/**', 'evidence/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'evidence/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      BROWSER: ${{ matrix.browser }}
      ARTIFACT_DIR: artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Selenium и API
        run: python -m pytest -v --junitxml=artifacts/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.browser }}
          path: artifacts/
  puppeteer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Запуск приложения и Puppeteer
        shell: bash
        run: |
          mkdir -p artifacts
          python app/server.py > artifacts/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          CHROME_BINARY="$(command -v google-chrome)" npm run test:puppeteer | tee artifacts/puppeteer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-puppeteer
          path: artifacts/
